<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Угасающее Сердце — Портал Игрока и Мастера</title>
<style>
  :root { --bg: #0f0f12; --panel: #18181d; --card: #202027; --border: #33333e; --gold: #d4a359; --blood: #a83232; --text: #e4e2dd; --muted: #8e8c87; --green: #6ab07c; }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
  header { background: #141418; border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 18px; font-weight: bold; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; }
  .nav-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: #26262f; color: var(--gold); border: 1px solid var(--border); padding: 7px 13px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.15s; }
  button:hover { background: var(--gold); color: #111; }
  button.primary { background: var(--gold); color: #111; border-color: var(--gold); }
  button.primary:hover { background: #e5b76e; }
  button.danger { border-color: var(--blood); color: #f08080; }
  button.danger:hover { background: var(--blood); color: #fff; }
  .container { max-width: 1280px; margin: 20px auto; padding: 0 18px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  h2, h3 { color: var(--gold); margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .grid-6 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
  input[type="text"], input[type="number"], input[type="password"], select, textarea {
    width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 6px; font-size: 14px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 75px; }
  .stat-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
  .stat-mod { font-size: 20px; font-weight: bold; color: var(--gold); margin: 4px 0; }
  .sheet-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .sheet-tab { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 9px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .sheet-tab.active { background: var(--gold); color: #111; border-color: var(--gold); }
  .skill-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; border-bottom: 1px solid #24242c; font-size: 13px; }
  .skill-row label { margin: 0; text-transform: none; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .chk-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chk-box { width: 22px; height: 22px; accent-color: var(--blood); cursor: pointer; }
  .wizard-step { border: 2px solid var(--border); border-radius: 8px; padding: 14px; cursor: pointer; background: var(--card); transition: 0.15s; }
  .wizard-step.selected { border-color: var(--gold); background: #28241d; }
  .badge { display: inline-block; background: #2c2c36; color: var(--gold); padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-bottom: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #24242d; color: var(--gold); }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
  .modal.open { display: flex; }
  .modal-box { background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; padding: 24px; width: 90%; max-width: 400px; }
  .small { font-size: 13px; color: var(--muted); line-height: 1.45; }
  .warn { color: #e06c75; font-weight: bold; font-size: 13px; }
  .res { color: var(--green); } .dis { color: #e06c75; }
</style>
</head>
<body>
<header>
  <div class="logo">🔥 Угасающее Сердце</div>
  <div class="nav-btns" id="top-nav">
    <button onclick="showWizard()">+ Новый персонаж</button>
    <button onclick="exportChar()">💾 Экспорт JSON</button>
    <button onclick="document.getElementById('imp-file').click()">📂 Импорт JSON</button>
    <input type="file" id="imp-file" style="display:none" accept=".json" onchange="importChar(event)">
    <button class="danger" id="gm-login-btn" onclick="openGmModal()">🔒 Вход Мастера</button>
  </div>
</header>

<div class="container" id="main-view"></div>

<!-- Модальное окно входа Мастера -->
<div class="modal" id="gm-modal">
  <div class="modal-box">
    <h3>Авторизация Мастера</h3>
    <p class="small">Данные Мастера зашифрованы (AES-256-GCM). Введите пароль для расшифровки в оперативной памяти браузера:</p>
    <input type="password" id="gm-pass-input" placeholder="Мастер-пароль..." onkeydown="if(event.key==='Enter') unlockGM()">
    <p class="warn" id="gm-err" style="display:none">Неверный пароль!</p>
    <div style="display:flex; gap:8px; margin-top:14px; justify-content:flex-end;">
      <button onclick="closeGmModal()">Отмена</button>
      <button class="primary" onclick="unlockGM()">Войти</button>
    </div>
  </div>
</div>
<script>
const BUNDLE = {"public": {"liks": [{"id": 1, "name": "Разорванные Цепи", "essence": "Воин, чья ярость — не дар, а проклятие, медленно разрывающее его тело. Он не впадает в бешенство — он отпускает цепи, сковывающие внутреннего зверя.", "params": {"Кубик хитов": "1d12", "Хиты на 1-й Ступени": "12 + мод. Телосложения", "Хиты на следующих": "1d12 (или 7) + мод. Телосложения", "Владение доспехами": "Лёгкие, средние", "Владение оружием": "Простое, воинское", "Владение инструментами": "Один набор", "Спасброски": "Сила, Телосложение", "Навыки": "Два из: Атлетика, Запугивание, Выживание, Внимательность, Медицина, Природа"}, "mechanic_notes": ["Ключевая механика: Шкала Разрыва", "Шкала (от 0 до 3 на старте, до 6 на 17-й Ступени) растёт в бою и сбрасывается, если вы целый раунд не атаковали, не получали урон и не применяли Цепи.", "+1 деление в начале вашего хода, если вы в бою.", "+1 деление, когда вы получаете урон (раз в ход).", "+2 деления при критическом ударе или убийстве.", "1 (Натяжение): +2 к урону оружием. Движение от врагов стоит вдвое (не можете добровольно отступать).", "2 (Треск): Дополнительная атака оружием бонусным действием. В конце хода, если рядом нет врагов, спасбросок Мудрости Сл 10, иначе атакуете ближайшее существо.", "3 (Разрыв): +4 к урону оружием. Атаки с преимуществом. В конце хода, если не использовали Ихорный Взрыв, получаете 1к6 ихорным уроном."]}, {"id": 2, "name": "Железная Стена", "essence": "Несокрушимый страж, чья броня впитала молитвы павшего мира, а душа стала якорем реальности. Он не уклоняется — он принимает. Каждый удар по нему лишь укрепляет его связь с Лампадой, а накопленная боль превращается в кару для врагов или спасение для союзников.", "params": {"Кубик хитов": "1d12", "Хиты на 1-й Ступени": "12 + мод. Телосложения", "Хиты на следующих": "1d12 (или 7) + мод. Телосложения", "Владение доспехами": "Все доспехи, щиты", "Владение оружием": "Простое, воинское", "Владение инструментами": "Один набор (обычно каменщика или плотника)", "Спасброски": "Телосложение, Мудрость", "Навыки": "Два из: Атлетика, История, Проницательность, Запугивание, Выживание, Религия"}, "mechanic_notes": ["Ключевая механика: Живой Доспех (Заряды)", "Ваша броня — не мёртвый металл. Это якорь для душ павших воинов и впитанных молитв. В бою Доспех накапливает Заряды, которые можно тратить на защитные и атакующие приёмы.", "+1 за каждый удар, который попадает по вам (даже если урон нулевой).", "+2, когда вы получаете критический удар.", "+1, когда союзник в пределах 15 футов от вас получает урон (вы «принимаете» часть боли).", "Заряды сбрасываются до 0 после короткого или длинного отдыха.", "Базовые приёмы (трата зарядов реакцией или бонусным действием):", "Призрачный Щит (1 заряд, реакция): Когда союзник в 10 футах получает урон, уменьшите этот урон на 1d10 + ваш уровень. Вы получаете половину этого урона как ихорный (не уменьшается)."]}, {"id": 3, "name": "Шёпот Крови", "essence": "Убийца, чей клинок сочится ихором. Он не убивает сталью — он впускает в жертву Чёрную Кровь, и та разлагает её изнутри. Каждая смерть оставляет на его оружии осадок, и чем больше он убивает, тем смертоноснее становится. Но кровь жертв шепчет ему на ухо, и в этом шёпоте можно потерять себя.", "params": {"Кубик хитов": "1d8", "Хиты на 1-й Ступени": "8 + мод. Телосложения", "Хиты на следующих": "1d8 (или 5) + мод. Телосложения", "Владение доспехами": "Лёгкие", "Владение оружием": "Простое, фехтовальное, одноручное воинское (только колющее и режущее)", "Владение инструментами": "Воровские инструменты, набор травника", "Спасброски": "Ловкость, Интеллект", "Навыки": "Три из: Акробатика, Атлетика, Скрытность, Ловкость рук, Внимательность, Анализ, Обман"}, "mechanic_notes": ["Ключевая механика: Ихорное лезвие и Осадок", "Ихорное лезвие (1-я Ступень): Вы можете бонусным действием намазать своё оружие Чёрной Кровью (расходует 1 единицу Чёрной Крови). До конца вашего хода следующая атака этим оружием заставляет цель пройти спасбросок Телосложения (Сл = 8 + бонус мастерства + мод. Ловкости). Провал: цель получает 1к6 + ваш текущий Осадок ихорного урона и становится Осквернённой на 1 минуту. Успех: половина урона, статус не накладывается. Ихорная природа: ихорный урон от Ихорного лезвия игнорирует сопротивление и иммунитет к ихорному урону у существ, заражённых Чёрной Кровью (порождения Мора, нежить Акта I). Вы можете использовать Ихорное лезвие количество раз, равное вашему мод. Ловкости (минимум 1), до длинного отдыха.", "Статус Осквернённый (1 минута): В начале каждого своего хода цель получает 1к4 ихорного урона + ваш текущий Осадок.", "— Пока цель осквернена, она совершает с помехой спасброски от ваших способностей Шёпота Крови.", "— Статус не снимается повторным спасброском, пока вы находитесь в бою.", "— Если цель уже осквернена и получает статус снова, урон осквернения увеличивается на 1к4 (до максимума +2к4), а длительность обновляется. Иммунитет к яду не защищает от Осквернения.", "Осадок (1-я Ступень): Каждый раз, когда вы убиваете существо Ихорным лезвием, вы получаете 1 Осадок. Максимум Осадка: 3 на 1-й Ступени, 4 на 5-й, 5 на 9-й, 6 на 17-й. Формула: мгновенный урон при попадании — 1к6 + Осадок ихорного урона; урон в начале хода осквернённой цели — 1к4 + Осадок ихорного урона. Осадок открывает доступ к Техникам Крови и добавляется к урону любого Осквернения, наложенного вами. Осадок сбрасывается до 0 после длинного отдыха. Если вы не совершали убийств Ихорным лезвием 24 часа, Осадок снижается на 1.", "Скрытность Порчи (1-я Ступень)"]}, {"id": 4, "name": "Танец Пепла", "essence": "Акробат, скользящий меж теней, стирающий грань между жизнью и смертью. Каждое его действие оставляет призрачный Силуэт, способный принять удар или стать точкой возврата. Он не носит тяжёлой брони и не полагается на грубую силу — его защита в том, что смерть путается, не зная, какое из тел настоящее.", "params": {"Кубик хитов": "1d8", "Хиты на 1-й Ступени": "8 + мод. Телосложения", "Хиты на следующих": "1d8 (или 5) + мод. Телосложения", "Владение доспехами": "Лёгкие", "Владение оружием": "Простое, фехтовальное, метательное", "Владение инструментами": "Один музыкальный инструмент", "Спасброски": "Ловкость, Харизма", "Навыки": "Три из: Акробатика, Атлетика, Выступление, Скрытность, Ловкость рук, Обман"}, "mechanic_notes": ["Ключевая механика: Силуэты", "Каждое действие в бою оставляет после вас призрачный Силуэт — копию, застывшую в моменте движения. Силуэты не имеют хитов, не атакуют, но занимают клетку и существуют 1 раунд (до начала вашего следующего хода).", "1 Силуэт в конце вашего хода, если вы совершили хотя бы одно действие (атака, рывок, уклонение, отход).", "+1 Силуэт, если вы совершили критический удар или уклонились от атаки (промах врага при Уклонении).", "Максимум Силуэтов одновременно равен вашему показателю Ловкости (минимум 1).", "Использование Силуэтов (реакцией или бонусным действием):", "Эхо-защита (реакция): Когда вас атакуют, вы можете уничтожить 1 Силуэт в радиусе 10 футов, чтобы заставить атаку пройти по нему (автоматический промах по вам). Не работает против атак по области.", "Эхо-шаг (бонусное действие): Поменяться местами с одним из ваших Силуэтов в радиусе 30 футов. Не провоцирует атак."]}, {"id": 5, "name": "Угасший Свет", "essence": "Последний жрец павшей Лисары, чьи молитвы — это раны, перенесённые с чужих тел на своё. Он не просит небеса о чуде — он сам становится чудом, отдавая кровь и плоть. Его лечение не чистое: каждый исцелённый получает рубец, а сам он медленно превращается в живой сосуд боли.", "params": {"Кубик хитов": "1d8", "Хиты на 1-й Ступени": "8 + мод. Телосложения", "Хиты на следующих": "1d8 (или 5) + мод. Телосложения", "Владение доспехами": "Лёгкие, средние", "Владение оружием": "Простое", "Владение инструментами": "Набор травника, набор алхимика", "Спасброски": "Мудрость, Телосложение", "Навыки": "Три из: Медицина, Религия, Проницательность, Внимательность, Убеждение, Выживание"}, "mechanic_notes": ["Ключевая механика: Переливание", "Вместо заклинаний исцеления вы используете Переливание — перенос ран с союзников на себя. Это не магия в привычном смысле, а прямая жертва плоти.", "Базовое Переливание (1-я Ступень):", "Действие. Коснитесь раненого существа. Вы можете перенести на себя до 1к8 + ваш мод. Мудрости его урона. Его хиты восстанавливаются на эту же величину. Вы теряете столько же хитов. Этот урон не может быть уменьшен или перенаправлен.", "Вы можете использовать Переливание количество раз, равное вашему мод. Мудрости + ваш уровень (минимум 1). Использования восстанавливаются после короткого или длинного отдыха у Лампады. Вне Лампады — только после длинного отдыха.", "Каждый раз, когда вы лечите существо Переливанием, оно получает Чёрный Рубец (галочка). Вы сами не получаете Рубцов от использования Переливания — вы уже носите их все внутри.", "5-я Ступень: Вы можете использовать Переливание на расстоянии 30 футов (рана «перетекает» по воздуху), но урон себе увеличивается на 1к4.", "9-я Ступень (Разделение боли): Действием вы можете коснуться до трёх существ одновременно и распределить исцеление между ними. Урон себе равен сумме исцелённого."]}, {"id": 6, "name": "Вестник Конца", "essence": "Пророк, чей голос — эхо воли мёртвых богов. Он не просит и не молит — он оглашает приговоры, которые слышит в шелесте пепла. Каждое утро он выбирает, какие слова силы будут звучать в его устах, и платит за них Прахом павших.", "params": {"Кубик хитов": "1d8", "Хиты на 1-й Ступени": "8 + мод. Телосложения", "Хиты на следующих": "1d8 (или 5) + мод. Телосложения", "Владение доспехами": "Лёгкие", "Владение оружием": "Простое", "Владение инструментами": "Набор для каллиграфии, набор травника", "Спасброски": "Мудрость, Харизма", "Навыки": "Три из: Религия, История, Запугивание, Обман, Анализ, Проницательность"}, "mechanic_notes": ["Ключевая механика: Приговоры и Прах", "Прах (1-я Ступень): Вы собираете Прах с поверженных врагов. Каждый раз, когда существо с ПО 1/4 или выше умирает в радиусе 60 футов от вас, вы получаете 1 единицу Праха. Прах не теряется при смерти. Вы можете тратить Прах на активацию Приговоров и Слов Могилы.", "Приговоры (1-я Ступень): Каждое утро (во время длинного отдыха) вы выбираете 2 Приговора из списка известных вам. С ростом уровня число растёт: 2 на 1-й, 3 на 5-й, 4 на 9-й, 5 на 15-й. Вы не можете выбрать один и тот же Приговор дважды в один день. Вы можете активировать Приговор бонусным действием, потратив указанное количество Праха.", "Список Приговоров (базовые, доступные с 1-й Ступени):", "Приговоры высоких Ступеней (открываются позже):", "«Приговор Смерти» (11-я Ступень): Стоимость 5 Праха. Выберите существо в 60 фт. Если его хиты ниже 50, оно должно преуспеть в спасброске Телосложения (Сл 8 + БМ + Муд) или умереть. Если хиты выше — получает 6к8 ихорного урона. Раз в день.", "«Приговор Вечности» (17-я Ступень): Стоимость 10 Праха. Выберите существо в 60 фт. Оно не может быть исцелено, не может воскреснуть, и его душа не может покинуть тело (для ритуалов) до конца вашего следующего хода. Если оно умирает в этот момент — оно уничтожено навсегда. Раз в день.", "Ваш голос — орудие. Вы можете говорить шёпотом, который слышен на 100 футов, или криком, который слышен на милю. Вы получаете преимущество на проверки Запугивания голосом. Кроме того, вы всегда знаете, когда существо в радиусе 60 футов умирает — вы чувствуете это как тихий звон."]}, {"id": 7, "name": "Песнь Пепла", "essence": "Хранитель памяти мёртвых богов, чей голос воскрешает легенды. Он не колдует в привычном смысле — он собирает в мире Отголоски (фрагменты душ, событий, эмоций) и вплетает их в песни. У Лампады он готовит свой репертуар, а в бою активирует Отголоски, творя исцеление, урон или поддержку.", "params": {"Кубик хитов": "1d8", "Хиты на 1-й Ступени": "8 + мод. Телосложения", "Хиты на следующих": "1d8 (или 5) + мод. Телосложения", "Владение доспехами": "Лёгкие", "Владение оружием": "Простое, фехтовальное", "Владение инструментами": "Три музыкальных инструмента на выбор", "Спасброски": "Ловкость, Харизма", "Навыки": "Три из: Выступление, История, Убеждение, Обман, Анализ, Проницательность, Акробатика"}, "mechanic_notes": ["Ключевая механика: Отголоски и Память", "Сбор Отголосков: Вы не учите заклинания. Вы находите Отголоски — фрагменты душ павших, застывшие в мире. Отголоски выглядят как тусклые светящиеся ноты, парящие над пеплом, руинами, трупами, местами важных событий. Чтобы получить Отголосок, вы должны провести 10 минут, «слушая» место (проверка Выступления или Анализа, Сл зависит от древности события). Найденный Отголосок вы записываете в Книгу памяти. Максимум активных Отголосков равен вашему мод. Харизмы + уровень. Остальные хранятся в книге, но не готовы — их можно поменять у Лампады.", "Полный список Отголосков, их историю и механику поиска смотрите в Приложении 2: «Отголоски».", "Подготовка Отголосков у Лампады: Во время длинного отдыха у Лампады вы можете выбрать, какие Отголоски из вашей книги будут активны. Максимум активных Отголосков = ваш мод. Харизмы + уровень. Вы можете активировать Отголосок действием, потратив одну из ячеек Отголосков (количество ячеек растёт: 2 на 1-й, 3 на 5-й, 4 на 9-й, 5 на 15-й). Ячейки восстанавливаются после короткого отдыха (половина) или длинного отдыха (все). После короткого отдыха можно сменить один активный Отголосок.", "Примеры Отголосков (базовые, 1-й Ступени):", "Отголосок Скорби: Цель в 60 фт должна преуспеть в спасброске Мудрости (Сл 8 + БМ + Хар) или получить 2к6 психического урона и помеху на следующую атаку. (Стоимость: 1 ячейка)", "Отголосок Надежды: Союзник в 60 фт восстанавливает 1к8 + ваш мод. Харизмы хитов и получает временные хиты, равные вашему уровню. (Стоимость: 1 ячейка)", "Отголосок Ярости: Союзник в 30 фт получает +1к4 к следующему броску атаки и урона до конца вашего следующего хода. (Стоимость: 1 ячейка)"]}, {"id": 8, "name": "Шёпот Бездны", "essence": "Голос, несущий не надежду, а безумие Мора. Он не вдохновляет — он разлагает разум врага, сея паранойю, страх и галлюцинации. Его сила растёт от собственного безумия: чем глубже он погружается в Шёпот, тем разрушительнее его слова, но тем выше шанс, что он сам захлебнётся в Бездне.", "params": {"Кубик хитов": "1d8", "Хиты на 1-й Ступени": "8 + мод. Телосложения", "Хиты на следующих": "1d8 (или 5) + мод. Телосложения", "Владение доспехами": "Лёгкие", "Владение оружием": "Простое", "Владение инструментами": "Один музыкальный инструмент, набор травника", "Спасброски": "Харизма, Интеллект", "Навыки": "Три из: Обман, Запугивание, Выступление, Скрытность, Анализ, Проницательность"}, "mechanic_notes": ["Ключевая механика: Шкала Безумия и Рассудок", "Рассудок (1-я Ступень): Ваш ресурс — очки Рассудка. Максимум равен вашему уровню + мод. Харизмы + бонус мастерства. Рассудок тратится на активацию Шёпотов и Голосов Бездны. Рассудок не восстанавливается после короткого отдыха — только после длинного отдыха (восстанавливается половина) или у Лампады (полностью). Вы можете также восстановить 1 очко Рассудка, если существо в радиусе 30 футов проваливает спасбросок от вашего Шёпота (не чаще раза в ход).", "Шкала Безумия (1-я Ступень): Параллельно с Рассудком существует Шкала Безумия (от 0 до 10). Она растёт, когда вы используете тёмные способности:", "+1 каждый раз, когда вы активируете Шёпот.", "+2, когда вы убиваете существо Шёпотом (психическим уроном).", "+1, когда вы сами получаете психический урон.", "Шкала Безумия снижается на 1 деление за каждый час отдыха вне боя.", "Шёпот (базовый, 1-я Ступень): Вы можете действием прошептать слова, которые разлагают разум. Выберите существо в радиусе 60 футов, которое может вас слышать. Оно должно преуспеть в спасброске Мудрости (Сл 8 + БМ + мод. Харизмы) или получить 1к8 психического урона и помеху на следующую атаку или проверку. Стоимость: 1 Рассудок."]}, {"id": 9, "name": "Гниющая Роща", "essence": "Страж умирающего леса, сам становящийся частью порчи. Он не изгоняет скверну — он вбирает её в себя и даёт ей иную форму: грибы, споры, лианы и плесень. Его сила растёт не от ярости или веры, а от самой Чёрной Крови, которую он фильтрует через свою плоть.", "params": {"Кубик хитов": "1d8", "Хиты на 1-й Ступени": "8 + мод. Телосложения", "Хиты на следующих": "1d8 (или 5) + мод. Телосложения", "Владение доспехами": "Лёгкие, средние, щиты (не металлические)", "Владение оружием": "Простое, плеть, серп, коса", "Владение инструментами": "Набор травника или алхимика", "Спасброски": "Телосложение, Мудрость", "Навыки": "Два из: Природа, Выживание, Медицина, Анализ, Скрытность, Запугивание"}, "mechanic_notes": ["Ключевая механика: Споры и кости хитов", "Споры (1-я Ступень): Вы не используют заклинания. Вы выдыхаете, разбрызгиваете или выпускаете из кожи Споры — облака гнилостной жизни, которые подчиняются вашей воле. Для активации Спор вы тратите кости хитов (ресурс, который используется также для лечения на коротком отдыхе).", "Выброс спор (бонусное действие): Потратьте 1 кость хитов и выберите точку в радиусе 30 фт. Создаётся облако спор радиусом 10 фт до начала вашего следующего хода. Существа, входящие или начинающие ход в облаке, должны преуспеть в спасброске Телосложения (Сл 8 + БМ + мод. Телосложения) или получить 1к6 урона ядом и помеху на скорость до конца их следующего хода.", "Вы можете использовать Выброс спор количество раз, равное вашему мод. Телосложения (минимум 1), до короткого или длинного отдыха. Каждое использование тратит 1 кость хитов.", "Споры не различают друзей и врагов. Союзники в облаке тоже проходят спасбросок.", "Дыхание Рощи (1-я Ступень): Вы получаете сопротивление урону ядом и преимущество на спасброски против отравления. Ваша кожа имеет зеленоватый или серый оттенок, и вы можете дышать под водой (или в ихоре), фильтруя токсины через поры.", "Внеступенчатая находка: Семена Гнили. См. Приложение 5.", "Корни (2): Вы можете действием коснуться земли и узнать, что происходит в радиусе 100 футов на поверхности (существа, их примерный размер, движение). Вы чувствуете вибрации."]}, {"id": 10, "name": "Зодчий Мёртвых", "essence": "Властелин праха, чей голос поднимает павших, а воля сплавляет кости в смертоносные легионы. Он не создаёт армию бездумных слуг — он ткёт из останков Аватара Пепла, могущественного генерала, который ведёт за собой призрачную орду. Его сила — в неумолимом давлении, в управлении пространством и в способности обрушить на врагов саму смерть.", "params": {"Кубик хитов": "1d6", "Хиты на 1-й Ступени": "6 + мод. Телосложения", "Хиты на следующих": "1d6 (или 4) + мод. Телосложения", "Владение доспехами": "Лёгкие", "Владение оружием": "Простое", "Владение инструментами": "Набор алхимика, набор для лепки", "Спасброски": "Интеллект, Мудрость", "Навыки": "Три из: Магия (Тайны), История, Медицина, Анализ, Религия, Убеждение"}, "mechanic_notes": ["Ключевая механика: Аватар Пепла и Шкала Легиона", "Аватар Пепла (1-я Ступень): Вы проводите 10-минутный ритуал и тратите 5 единиц Праха, чтобы создать или пересобрать могущественного Аватара Пепла. У вас может быть только один Аватар одновременно. Он использует ваш Бонус Мастерства для атак и спасбросков. Его хиты = (ваш уровень + мод. Интеллекта) × 5. Его КД = 13 + ваш Бонус Мастерства. Если Аватар уничтожен, вы получаете 1 уровень истощения и можете призвать его заново после короткого отдыха (потратив Прах).", "Формы Аватара (выбор при создании): Вы выбираете одну из трёх Форм. Она определяет тип призрачного Легиона, который ведёт Аватар. Вы можете сменить Форму во время короткого отдыха, потратив 3 Праха.", "Форма Легиона Костей (Танк/Контроль): Аватар получает +2 КД и +20 хитов. Бонусным действием вы можете создать Стену Костей (линия призрачных шипов длиной 20 фт, шириной 5 фт) на 1 минуту. Она считается труднопроходимой местностью и наносит 1к4 колющего урона за каждые 5 футов передвижения по ней.", "Форма Легиона Духов (Урон/Мобильность): Аватар получает +15 фт скорости и сопротивление обычному оружию. Бонусным действием вы можете призвать Рой Мёртвых: выберите врага в 30 фт. Призрачные духи наносят ему 1к8 + ваш мод. Интеллекта ихорного урона. Если цель умирает, вы можете немедленно применить эту способность к новой цели (1 раз в ход).", "Форма Легиона Чумы (Поддержка/Дебuffs): Аватар получает сопротивление яду и ихорному урону. Его присутствие создаёт Ауру Упадка (15 фт): враги в ауре не могут восстанавливать хиты. Бонусным действием вы можете заставить Ауру «вспыхнуть», заставляя всех в ней пройти спасбросок Телосложения (Сл 8 + БМ + Инт) или стать отравленными до конца вашего следующего хода.", "Шкала Легиона (Ресурс, 1-я Ступень): Вместо призыва множества мелких слуг, вы накапливаете Заряды Легиона (максимум = ваш уровень + мод. Интеллекта). Вы получаете 1 заряд, когда:", "Вы или ваш Аватар убиваете существо (добивание)."]}, {"id": 11, "name": "Сердце Пламени", "essence": "Воин, вобравший искру драконьего пламени, что пылало в Сердце Мира до прихода Мора. Его огонь — не стихия, не магия и не дар богов. Это очищающая агония, рождённая из самой жизни, превращённой в топливо. Он сжигает Прах, обращая его в разрушительные взрывы, лучи и стены пламени.", "params": {"Кубик хитов": "1d8", "Хиты на 1-й Ступени": "8 + мод. Телосложения", "Хиты на следующих": "1d8 (или 5) + мод. Телосложения", "Владение доспехами": "Лёгкие, средние, щиты", "Владение оружием": "Простое, фехтовальное", "Владение инструментами": "Набор алхимика, набор стеклодува", "Спасброски": "Телосложение, Мудрость", "Навыки": "Два из: Магия (Тайны), Природа, Выживание, Анализ, Запугивание, Медицина"}, "mechanic_notes": ["Ключевая механика: Пламя Праха", "Топливо — Прах: Вы используете Прах (общий расходный ресурс). Вы получаете Прах как обычно: когда существо с ПО 1/4 или выше умирает в 60 футах, вы получаете 1 Прах в общий пул (без затраты реакции). Прах не теряется при смерти.", "Пламя Праха (1-я Ступень): Вы можете действием потратить 1 Прах, чтобы создать один из следующих эффектов:", "Огненный луч: Дальность 60 фт, одна цель. Дальнобойная атака заклинанием (+ ваш БМ + мод. Мудрости). Попадание: 1к10 + ваш уровень урона огнём. При критическом попадании цель загорается (1к4 урона огнём в начале её хода, пока не потушит).", "Огненная вспышка: Радиус 15 фт с центром на вас. Все существа (кроме вас) должны преуспеть в спасброске Ловкости (Сл = 8 + БМ + мод. Мудрости) или получить 2к6 урона огнём (половина при успехе). Вы получаете 1к4 урона огнём (не может быть уменьшен).", "Огненное оружие: Бонусным действием вы воспламеняете своё оружие или оружие союзника в 10 фт. На 1 минуту (Концентрация) оно наносит дополнительный 1к4 урона огнём и считается магическим.", "Искра Жизни (1-я Ступень): Вы получаете сопротивление урону огнём. Ваше тело всегда тёплое на ощупь. Вы можете разжигать небольшие костры прикосновением.", "Внеступенчатая находка: Искры Первого Огня. См. Приложение 5."]}, {"id": 12, "name": "Пустой Кулак", "essence": "Аскет, отринувший мир, богов и само желание существовать. Он не накапливает ярость, не жжёт прах, не молит о чуде. Он опустошает себя, чтобы стать сосудом для Пустоты — изначального ничто, что было до богов и останется после Мора. В бою он замирает, позволяя Пустоте заполнить его, а затем высвобождает её серией ударов или короткими телепортациями.", "params": {"Кубик хитов": "1d8", "Хиты на 1-й Ступени": "8 + мод. Телосложения", "Хиты на следующих": "1d8 (или 5) + мод. Телосложения", "Владение доспехами": "Без доспехов (Пустотная защита)", "Владение оружием": "Простое, короткие мечи", "Владение инструментами": "Один ремесленный инструмент", "Спасброски": "Ловкость, Мудрость", "Навыки": "Три из: Акробатика, Атлетика, Скрытность, Анализ, Религия, Проницательность"}, "mechanic_notes": ["Ключевая механика: Шкала Пустоты", "Шкала Пустоты (1-я Ступень): Вы накапливаете заряды Пустоты, когда отказываетесь от действий. Каждый раз, когда вы пропускаете действие в свой ход (не атакуете, не применяете заклинания, не активируете способности), вы получаете 1 заряд Пустоты. Пропуск бонусного действия или реакции не даёт зарядов — только основное действие. Максимум зарядов равен вашему мод. Мудрости + бонус мастерства (минимум 2). Заряды сохраняются между боями, но рассеиваются после короткого или длинного отдыха (если не изучена Медитация).", "Траты зарядов Пустоты: Вы можете потратить заряды Пустоты на следующие эффекты (не требует действия, если не указано иное):", "Пустотный удар: Когда вы совершаете атаку оружием или безоружным ударом, вы можете потратить 1 заряд, чтобы нанести дополнительный урон силовым полем, равный 1к8 + ваш мод. Мудрости. Вы можете объявить это после броска атаки, но до броска урона.", "Пустотный шаг: Бонусным действием потратить 2 заряда — телепортироваться на 30 футов в свободное пространство, которое вы видите.", "Пустотное уклонение: Реакцией, когда вас атакуют, потратить 1 заряд, чтобы добавить +2 КД против этой атаки.", "Пустотное дыхание: Действием потратить 3 заряда — выдохнуть конус пустоты 15 фт. Все существа в конусе должны преуспеть в спасброске Телосложения (Сл = 8 + БМ + мод. Мудрости) или получить 2к6 урона силовым полем и быть неспособными использовать реакции до конца вашего следующего хода.", "Пустотная защита (1-я Ступень): Пока вы не носите доспехов и не используете щит, ваш КД равен 10 + мод. Ловкости + мод. Мудрости."]}, {"id": 13, "name": "Пепельный Кулак", "essence": "Воин-мученик, чьё тело излучает испепеляющее сияние, пожирающее его самого. Он не просто сражается — он сгорает, превращая свою плоть в свет, разящий порчу. Его удары обжигают врагов излучением, а его кровь — расплавленный пепел. Чем ближе он к смерти, тем ярче горит его пламя.", "params": {"Кубик хитов": "1d10", "Хиты на 1-й Ступени": "10 + мод. Телосложения", "Хиты на следующих": "1d10 (или 6) + мод. Телосложения", "Владение доспехами": "Без доспехов (Пепельная защита)", "Владение оружием": "Простое, боевые перчатки", "Владение инструментами": "Набор алхимика или травника", "Спасброски": "Сила, Мудрость", "Навыки": "Три из: Атлетика, Выживание, Медицина, Религия, Проницательность, Запугивание"}, "mechanic_notes": ["Ключевая механика: Свет Мученика", "Свет Мученика (1-я Ступень): Вы не используете ячейки заклинаний. Ваше тело генерирует сияние, которое вы можете направить на врагов или союзников ценой собственных сил. Вы получаете запас Свечений (очки Света), равный вашему мод. Мудрости + уровень (минимум 1). Свечения восстанавливаются после короткого отдыха (половина) или длинного отдыха (все).", "Базовые применения Свечений:", "Обжигающий удар: Когда вы попадаете по существу безоружным ударом или атакой оружием, вы можете потратить 1 Свечение, чтобы нанести дополнительный урон излучением, равный 1к8 + ваш мод. Мудрости. Если цель — нежить или порождение Мора, урон удваивается.", "Вспышка надежды: Бонусным действием потратить 2 Свечения — выберите союзника в 30 фт. Он восстанавливает хиты, равные 1к8 + ваш мод. Мудрости, и получает временные хиты, равные вашему уровню. Вы получаете 1к4 урона ихорным уроном.", "Очищающий свет: Действием потратить 3 Свечения — вы создаёте вспышку в радиусе 10 фт вокруг себя. Все союзники исцеляют 1к6 хитов и избавляются от состояния «отравлен» или «испуган». Все враги получают 2к6 урона излучением. Вы получаете 2к4 урона ихорным уроном.", "Пепельная защита (1-я Ступень): Пока вы не носите доспехов и не используете щит, ваш КД равен 10 + мод. Ловкости + мод. Мудрости. Ваша кожа покрыта тонким слоем пепла, который рассеивает часть ударов.", "Огненная кровь (2-я Ступень): Вы получаете сопротивление урону излучением. Когда вы получаете урон от своей способности (ихорным уроном), вы можете реакцией воспламенить свою кровь — все существа в 5 фт от вас получают 1к4 урона огнём."]}, {"id": 14, "name": "Последняя Клятва", "essence": "Рыцарь, чей обет пережил смерть богов. Он не молит о силе — он даёт слово, и сама реальность склоняется перед ним, пока он его держит. Каждый его Обет — это договор с самим мирозданием: он получает мощь, но платит ограничениями. Нарушение клятвы карается не богами, а собственной душой.", "params": {"Кубик хитов": "1d10", "Хиты на 1-й Ступени": "10 + мод. Телосложения", "Хиты на следующих": "1d10 (или 6) + мод. Телосложения", "Владение доспехами": "Все доспехи, щиты", "Владение оружием": "Простое, воинское", "Владение инструментами": "Набор каллиграфа или ювелира", "Спасброски": "Мудрость, Харизма", "Навыки": "Три из: Атлетика, История, Религия, Убеждение, Запугивание, Проницательность"}, "mechanic_notes": ["Ключевая механика: Обеты и Наручники Веры", "Обеты (1-я Ступень): Каждое утро (во время длинного отдыха) вы выбираете подготовленные Обеты из списка известных вам. Количество подготовленных Обетов равно вашему мод. Харизмы + половина уровня (минимум 1). Вы не можете выбрать один и тот же Обет дважды.", "Наручники Веры (1-я Ступень): Ваш ресурс — Наручники Веры (очки Клятвы). Максимум равен вашему мод. Харизмы + бонус мастерства. Они тратятся на активацию Обетов. Восстанавливаются: половина после короткого отдыха, все после длинного отдыха. Лампада полностью восстанавливает Наручники и снимает Клеймо Клятвопреступника.", "Активация Обета: Вы можете бонусным действием потратить 1 Наручник Веры, чтобы объявить Обет (голосом, слышимым на 60 фт) и выбрать цель. Обет действует, пока вы не завершите его (свободное действие) или не нарушите условия. Вы не можете иметь более одного активного Обета одновременно (до 11-й Ступени). Нарушение Обета немедленно завершает его и накладывает Клеймо Клятвопреступника: вы не можете активировать новые Обеты, пока не завершите короткий отдых или не проведёте ритуал покаяния у Лампады.", "Базовые Обеты (доступны с 1-й Ступени):", "Вы получаете преимущество на спасброски от очарования и страха. Ваше слово нерушимо: если вы даёте обещание (не Обет, а обычное слово), вы чувствуете моральную боль при его нарушении (отыгрыш, помеха на проверки Харизмы до искупления).", "Внеступенчатая находка: Свитки Древних Клятв. См. Приложение 5.", "Непоколебимость (2): Вы получаете +1 к максимуму хитов за каждую Ступень (ретроактивно)."]}, {"id": 15, "name": "Пламя Очищения", "essence": "Каратель, сжигающий ересь Чёрной Крови. Его оружие — священный огонь, который питается не верой, а самой порчей. Он не молится — он выносит приговор и приводит его в исполнение, используя Прах поверженных врагов как топливо для очистительного пламени.", "params": {"Кубик хитов": "1d10", "Хиты на 1-й Ступени": "10 + мод. Телосложения", "Хиты на следующих": "1d10 (или 6) + мод. Телосложения", "Владение доспехами": "Средние доспехи, щиты", "Владение оружием": "Простое, воинское", "Владение инструментами": "Набор палача или алхимика", "Спасброски": "Сила, Мудрость", "Навыки": "Три из: Атлетика, Запугивание, Религия, Анализ, Проницательность, Выживание"}, "mechanic_notes": ["Ключевая механика: Очищающее Пламя и Прах", "Очищающее Пламя (1-я Ступень): Вы можете направить Прах на создание священного огня. Вы получаете Прах из общего пула.", "Базовые применения (тратят Прах):", "Возжигание (бонусное действие): Потратьте 1 Прах и выберите оружие. На 1 минуту оно наносит дополнительный 1к6 урона излучением и считается магическим. Против нежити/культистов — 1к10.", "Огненная кара (реакция): Когда существо в 30 фт получает урон от вашего оружия или заклинания союзника, потратьте 2 Праха, чтобы нанести ему 2к8 + ваш мод. Мудрости урона излучением. Порождения Мора должны преуспеть в спасброске Телосложения (Сл 8 + БМ + Муд) или загореться (1к4 излучения в начале хода).", "Печать Очищения (действие): Потратьте 3 Праха и коснитесь существа. На 1 минуту в начале каждого хода цель получает 1к6 урона излучением (2к6 против нежити/порождений), и все её сопротивления уменьшаются на 1 (до минимума 0). Нежить не может регенерировать.", "Клеймо Еретика (1-я Ступень): Вы можете бонусным действием объявить одно существо в 60 фт Еретиком. Пока вы живы и видите его, вы получаете +2 к урону против него. Если Еретик убивает невинного или союзника, вы немедленно получаете 1 Прах. Сменить цель можно после короткого отдыха или если текущий Еретик мёртв.", "Внеступенчатая находка: Печати Инквизиции. См. Приложение 5."]}, {"id": 16, "name": "Тени Мора", "essence": "Следопыт, посвятивший себя истреблению порождений Мора. Он не просто охотник — он анатом, препарирующий тварей и познающий их слабости. Он собирает Образцы — части тел, ихор, кости — и создаёт из них Сыворотки, дающие временные преимущества против конкретных типов существ.", "params": {"Кубик хитов": "1d10", "Хиты на 1-й Ступени": "10 + мод. Телосложения", "Хиты на следующих": "1d10 (или 6) + мод. Телосложения", "Владение доспехами": "Лёгкие, средние, щиты", "Владение оружием": "Простое, воинское", "Владение инструментами": "Набор алхимика, набор для вскрытия", "Спасброски": "Сила, Ловкость", "Навыки": "Три из: Выживание, Природа, Анализ, Медицина, Скрытность, Внимательность"}, "mechanic_notes": ["Ключевая механика: Анатомия Мора, Образцы и Сыворотки", "Анатомия Мора (1-я Ступень): Вы изучаете порождения Мора, препарируя их. Потратив 10 минут на вскрытие свежего трупа (убитого не позже 1 часа назад), вы получаете Образец — часть ихора, кость, орган. Вы также получаете знание об этом типе существ: постоянный бонус +1 к урону против этого типа (растёт: +2 на 5-й, +3 на 11-й, +4 на 17-й). Можете помнить мод. Интеллекта + бонус мастерства типов одновременно.", "Образцы (1-я Ступень): Вы носите с собой Образцы. Максимум: ваш мод. Интеллекта + уровень. Они не портятся и не теряются при смерти, но их можно использовать только для создания Сывороток.", "Сыворотки (1-я Ступень): Во время короткого отдыха создаёте Сыворотку из одного Образца. Одноразовый предмет, действует 1 час. Максимум активных Сывороток: мод. Интеллекта. Можете передать союзнику.", "Сыворотка Уязвимости: Оружие наносит выбранному типу дополнительный 1к6 урона (тип зависит от образца).", "Сыворотка Сопротивления: Сопротивление урону от атак выбранного типа на 1 час.", "Сыворотка Обнаружения: Чувствуете выбранный тип в радиусе 120 фт на 1 час.", "Внеступенчатая находка: Анатомические Схемы. См. Приложение 5."]}, {"id": 17, "name": "Чёрная Метка", "essence": "Проклятый скиталец, в чьей душе засела частица самого Мора. Он не изучает порождения — он сам стал родственен им. Чёрная Метка на его теле пульсирует в унисон с ихором врагов, позволяя ему видеть скрытое, проходить сквозь тени и обращать проклятие против тех, кто его наслал.", "params": {"Кубик хитов": "1d10", "Хиты на 1-й Ступени": "10 + мод. Телосложения", "Хиты на следующих": "1d10 (или 6) + мод. Телосложения", "Владение доспехами": "Лёгкие, средние", "Владение оружием": "Простое, воинское", "Владение инструментами": "Набор для татуировок или алхимика", "Спасброски": "Телосложение, Мудрость", "Навыки": "Три из: Выживание, Скрытность, Запугивание, Проницательность, Анализ, Обман"}, "mechanic_notes": ["Ключевая механика: Чёрная Метка и Чёрная Кровь", "Чёрная Метка (1-я Ступень): Вы можете хранить запас Чёрной Крови, извлечённой из трупов заражённых существ (Том 1, гл. 4.4), в специальном резервуаре. Максимальный объём резервуара: ваш мод. Телосложения + бонус мастерства (минимум 1). Чёрная Кровь физически находится при вас, портится через 24 часа без стабилизатора, может использоваться как для классовых способностей, так и для крафта. Сбор: стандартные правила + реакция при смерти заражённого в 60 фт (без проверки, если существо заражено).", "Расходование Чёрной Крови:", "Удар Метки: Когда вы попадаете по существу атакой оружием, можете потратить 1 единицу Чёрной Крови, чтобы нанести дополнительный урон ихорным уроном, равный 1к8 + ваш мод. Телосложения. Если цель — нежить или культист, вы также получаете временные хиты, равные половине нанесённого урона.", "Шаг сквозь тень (бонусное действие): Потратьте 2 единицы Чёрной Крови — телепортируйтесь на 30 футов в свободное пространство, которое находится в тусклом свете или темноте. Можете взять с собой одно добровольное существо в радиусе 5 фт, но оно получает 1к4 урона ихорным уроном.", "Чутьё Мора (пассивно): Вы знаете направление и примерное расстояние до ближайшего существа, заражённого Чёрной Кровью, в радиусе 100 футов × ваш бонус мастерства. Вы также видите невидимых существ, если они заражены Чёрной Кровью.", "Притяжение порчи (недостаток): Ваша Метка — маяк. Все порождения Мора и культисты в радиусе 300 футов знают ваше местоположение, пока у вас есть хотя бы 1 единица Чёрной Крови. Они всегда атакуют вас в первую очередь, если нет другой прямой угрозы. Вы не можете скрыться от них магией. Внеступенчатая находка: Осколки Метки. См. Приложение 5.", "Шаг сквозь тень (2): Становится доступным как бонусное действие за 2 единицы Чёрной Крови (описан выше)."]}, {"id": 18, "name": "Разбитая Звезда", "essence": "Чародей, чья кровь заражена осколками божественных сфер, разбившихся при падении пантеона. Он не колдует в привычном смысле — он высвобождает хаотическую энергию, что течёт в его жилах, и каждый раз это может обернуться благословением, проклятием или чудом. Его ресурс — Звёздная Кровь, которая бурлит в нём и восстанавливается от хаоса вокруг.", "params": {"Кубик хитов": "1d6", "Хиты на 1-й Ступени": "6 + мод. Телосложения", "Хиты на следующих": "1d6 (или 4) + мод. Телосложения", "Владение доспехами": "Без доспехов (Звёздная защита)", "Владение оружием": "Простое", "Владение инструментами": "Набор для гадания", "Спасброски": "Телосложение, Харизма", "Навыки": "Три из: Магия (Тайны), История, Анализ, Обман, Запугивание, Убеждение"}, "mechanic_notes": ["Ключевая механика: Звёздная Кровь и Вспышка Хаоса", "Звёздная Кровь (1-я Ступень): Вы получаете запас Звёздной Крови, равный вашему мод. Харизмы + бонус мастерства (минимум 2). Она восстанавливается полностью после длинного отдыха и на 1 единицу каждый раз, когда вы получаете критический удар или когда существо в радиусе 30 футов от вас совершает критический успех или провал (в бою).", "Вспышка Хаоса (1-я Ступень): Вы можете действием потратить 1 единицу Звёздной Крови, чтобы вызвать выброс хаотической энергии. Выберите цель в радиусе 60 фт. Проведите дальнобойную атаку заклинанием (+ ваш БМ + мод. Харизмы). При попадании цель получает 1к12 урона (тип определяется броском d6: 1 — огонь, 2 — холод, 3 — электричество, 4 — кислота, 5 — силовое поле, 6 — психический). При критическом попадании активируется Воля Мёртвых Богов.", "Полную таблицу эффектов (d100) смотрите в Приложении 1: «Воля Мёртвых Богов».", "Звёздная защита (2-я Ступень): Пока вы не носите доспехов, ваш КД равен 13 + ваш мод. Ловкости. Вокруг вас мерцает поле искажённого света, отклоняющее удары.", "Внеступенчатая находка: Осколки Созвездий. См. Приложение 5.", "Воля Мёртвых Богов (1): Каждый раз, когда вы совершаете критическое попадание Вспышкой Хаоса, активируете Каскад Хаоса, или добровольно решаете «испытать судьбу», бросьте d100 по таблице. Эффект может быть полезным, вредным или странным.", "На 1–5 Ступенях вам доступны только эффекты 01–30 (Шёпот Хаоса)."]}, {"id": 19, "name": "Кровь Короля", "essence": "Наследник Чёрного Короля, в чьих жилах течёт неразбавленный ихор. Он не колдует и не молится — он приказывает, и порча подчиняется ему, признавая своего потомка. Его сила — это контроль над нежитью, тёмные благословения и способность обращать свою кровь в оружие.", "params": {"Кубик хитов": "1d8", "Хиты на 1-й Ступени": "8 + мод. Телосложения", "Хиты на следующих": "1d8 (или 5) + мод. Телосложения", "Владение доспехами": "Лёгкие", "Владение оружием": "Простое", "Владение инструментами": "Набор алхимика или фальсификатора", "Спасброски": "Харизма, Телосложение", "Навыки": "Три из: Обман, Запугивание, Убеждение, История, Магия (Тайны), Проницательность"}, "mechanic_notes": ["Ключевая механика: Наследие Короля", "Наследие Короля (1-я Ступень): Ваш ресурс — Воля Короля. Запас равен вашему мод. Харизмы + половина уровня (минимум 1). Воля восстанавливается полностью после короткого или длинного отдыха. Вы можете тратить её на следующие эффекты:", "Приказ Порче: Действием потратить 1 единицу Воли и выбрать одно существо в 60 фт, заражённое Чёрной Кровью. Оно должно преуспеть в спасброске Мудрости (Сл = 8 + БМ + ваш мод. Харизмы) или попасть под ваш контроль на 1 минуту (концентрация). Существа с ПО выше вашего уровня получают преимущество. Максимум одно существо одновременно (два на 11-й Ступени).", "Кровь-оружие (бонусное действие, 2-я Ступень): Потратьте 1 единицу Воли и 1к4 хитов. Ваше оружие на 1 минуту наносит дополнительный урон ихорным уроном, равный вашему мод. Харизмы + уровень, и считается магическим.", "Глас Крови (пассивно): Вы понимаете речь всех существ, заражённых Чёрной Кровью, и можете говорить с ними телепатически на расстоянии до 100 фт. Они воспринимают вас как «высшего» и не атакуют первыми, если вы не атакуете их. Вы также знаете, если в радиусе 1 мили находится другое существо с Наследием Короля.", "Вселение (1-я Ступень): Когда ваши хиты падают до 0 и вы не умираете мгновенно, вы не теряете сознание. Вместо этого ваше тело превращается в Сгусток Ихора — подвижную лужу чёрной жижи с вашим сознанием. В этой форме:", "Вы получаете временные хиты, равные вашему уровню.", "Скорость — 20 фт, можете проходить через щели, не провоцируете атак."]}, {"id": 20, "name": "Забытые Слова", "essence": "Искатель потерянных Слов Творения, которыми боги создавали реальность. Он не пользуется заученными заклинаниями — он собирает Слова, разбросанные по миру как осколки божественной речи, и комбинирует их во фразы, творя уникальные, неповторимые эффекты. Каждое Слово — одноразовый артефакт, который исчезает после использования, но оставляет след в его Книге Пепла.", "params": {"Кубик хитов": "1d6", "Хиты на 1-й Ступени": "6 + мод. Телосложения", "Хиты на следующих": "1d6 (или 4) + мод. Телосложения", "Владение доспехами": "Без доспехов", "Владение оружием": "Простое", "Владение инструментами": "Набор каллиграфа, набор для переплёта книг", "Спасброски": "Интеллект, Мудрость", "Навыки": "Три из: Магия (Тайны), История, Религия, Анализ, Проницательность, Убеждение"}, "mechanic_notes": ["Ключевая механика: Сбор Слов и Сочетания", "Сбор Слов (1-я Ступень): Вы находите Слова в мире. Слово — это одноразовый магический артефакт, который выглядит как светящийся знак, парящий над древним текстом, алтарём, местом силы или трупом бога. Чтобы получить Слово, вы должны расшифровать его (проверка Магии/Истории/Религии, Сл варьируется). Вы не можете создать Слово сами — только найти.", "Слова делятся на категории: Существительные, Глаголы и Свойства (Прилагательные/Наречия).", "Полный словарь (23 Существительных, 21 Глагол, 16 Свойств), правила грамматики и таблицу готовых фраз смотрите в Приложении 4: «Слова Силы».", "Вы храните найденные Слова в Книге Пепла. Максимальное количество Слов, которое вы можете носить с собой одновременно (активный словарь), равно вашему мод. Интеллекта + уровень. Остальные можно оставить в убежище.", "Дыхание Творения (1-я Ступень): Вы получаете запас Дыхания Творения, равный вашему мод. Интеллекта + бонус мастерства (минимум 2). Дыхание восстанавливается полностью после длинного отдыха и наполовину после короткого отдыха. Вы тратите Дыхание на составление фраз.", "Сочетание (базовое, 1-я Ступень): Вы можете действием потратить 1 единицу Дыхания и объединить два Слова из вашего активного словаря в простое предложение. Вы произносите его вслух. Реальность подчиняется: возникает магический эффект, соответствующий смыслу фразы. Мастер определяет точные параметры, руководствуясь примерами:", "Существительное + Глагол: создать элементальный эффект. «Огонь — Гореть» = струя пламени (3к6 урона огнём, конус 15 фт, спасбросок Ловкости). «Ветер — Течь» = порыв ветра (отталкивает врагов). «Камень — Стоять» = каменная стена (1 минута)."]}, {"id": 21, "name": "Зверь Апокалипсиса", "essence": "Охотник, в чьей крови живёт хищник Мора. Он не превращается полностью — он позволяет зверю выходить частями, отращивая когти, жвала, костяную броню или шипы за счёт Тёмной Желчи, добываемой из поверженных порождений. Каждая трансформация приближает его к необратимой мутации.", "params": {"Кубик хитов": "1d12", "Хиты на 1-й Ступени": "12 + мод. Телосложения", "Хиты на следующих": "1d12 (или 7) + мод. Телосложения", "Владение доспехами": "Лёгкие, средние", "Владение оружием": "Простое, воинское", "Владение инструментами": "Набор травника или алхимика", "Спасброски": "Сила, Телосложение", "Навыки": "Три из: Атлетика, Выживание, Скрытность, Природа, Запугивание, Внимательность"}, "mechanic_notes": ["Ключевая механика: Тёмная Желчь и Гибридная форма", "Тёмная Желчь (1-я Ступень): Вы добываете Тёмную Желчь из поверженных порождений Мора. Каждый раз, когда существо, заражённое Чёрной Кровью, с ПО не ниже 1/4 умирает в радиусе 60 футов от вас, вы получаете 1 единицу Тёмной Желчи. Также можно извлечь из трупа проверкой Выживания (Сл 10 + ПО). Максимальный запас: ваш мод. Телосложения + уровень + бонус мастерства. Желчь не портится и не теряется при смерти.", "Гибридная форма (1-я Ступень): Вы можете бонусным действием потратить 1 единицу Тёмной Желчи, чтобы активировать одну из следующих трансформаций на 1 минуту. Вы можете иметь активно одну трансформацию одновременно (на 9-й Ступени — две, на 17-й — три).", "Когти Зверя: Естественное оружие (1к8 + Сила рубящего, магическое). Бонусным действием дополнительная атака когтями.", "Жвала Мора: Атака укусом (1к10 + Сила колющего + 1к4 ядом). При крите — спасбросок Телосложения или отравление на 1 минуту.", "Костяная броня: +2 КД, сопротивление дробящему и колющему от немагического оружия. Скорость -5 фт.", "Шипы Мора: Атакующий в ближнем бою получает 1к6 колющего + 1к4 яда. Можете действием выстрелить шипом (дальность 30/60 фт, 1к8 колющего + 1к4 яда).", "Чутьё хищника (1-я Ступень): Преимущество на Выживание для выслеживания заражённых. Чуете ихор на расстоянии до 300 фт."]}, {"id": 22, "name": "Сломанный Клинок", "essence": "Мастер оружия, чей меч — осколок божественного клинка, помнящего вкус ихора. Он не владеет магией, не носит тяжёлых доспехов и не даёт клятв. Его сила — в Пробуждающемся Оружии, артефакте, который растёт в мощи от вложенного Праха и поверженных врагов.", "params": {"Кубик хитов": "1d10", "Хиты на 1-й Ступени": "10 + мод. Телосложения", "Хиты на следующих": "1d10 (или 6) + мод. Телосложения", "Владение доспехами": "Лёгкие, средние", "Владение оружием": "Простое, воинское (любое оружие из таблицы оружия D&D 5e)", "Владение инструментами": "Кузнечные инструменты, точильный камень", "Спасброски": "Сила, Ловкость", "Навыки": "Три из: Атлетика, Акробатика, Анализ, Запугивание, История, Внимательность"}, "mechanic_notes": ["Ключевая механика: Пробуждающееся Оружие и Стили Ковки", "Пробуждающееся Оружие (1-я Ступень): У вас есть оружие, с которым вы связаны духовно. На 1-й ступени оно всегда наносит 1к10 урона и может иметь вид любого оружия из таблицы оружия Книги Игрока D&D 5e, сохраняя все его свойства (фехтовальное, двуручное, лёгкое, метательное, досягаемость, боеприпасы). Один раз за бой вы можете бонусным действием потратить 1 Прах, чтобы перековать форму оружия в любой другой вид из таблицы (не снимает и не надевает щит автоматически); после окончания боя оружие возвращается в исходное состояние. Рост кости урона (до 1к12, 2к6) возможен только через особые чертежи, ритуалы или Тлеющие Угли.", "Вы тратите Прах и выполняете ритуалы у Большой Лампады, чтобы открывать новые свойства. Оружие имеет слоты для Рунных Шрамов (количество = Бонус Мастерства).", "Базовые Руны (доступны с 1-й Ступени):", "Руна Меткости (3 Праха): +1 к броскам атаки.", "Руна Заточки (5 Праха): +1 к броскам урона.", "Руна Баланса (4 Праха): +1 КД, пока держите оружие.", "Руна Парирования (4 Праха): +2 КД против одной атаки ближнего боя в раунд (реакция)."]}, {"id": 23, "name": "Пепельный Алхимик", "essence": "Мастер превращения скверны в оружие. Он не сражается мечом и не читает заклинаний — он готовит Экстракты из Чёрной Крови, Трофеев и редких компонентов, создавая бомбы, яды, мутагены и очищающие эликсиры. Его сила — в подготовке: он может снабдить группу расходниками, временно мутировать союзников или ослабить врага.", "params": {"Кубик хитов": "1d6", "Хиты на 1-й Ступени": "6 + мод. Телосложения", "Хиты на следующих": "1d6 (или 4) + мод. Телосложения", "Владение доспехами": "Лёгкие", "Владение оружием": "Простое, алхимические бомбы", "Владение инструментами": "Набор алхимика, набор травника", "Спасброски": "Интеллект, Ловкость", "Навыки": "Три из: Магия (Тайны), Медицина, Природа, Анализ, Ловкость рук, Выживание"}, "mechanic_notes": ["Ключевая механика: Экстракты и Ингредиенты", "Сбор Ингредиентов (1-я Ступень): Вы собираете Ингредиенты из поверженных врагов и окружающей среды. Основные категории:", "Трофеи (кости, когти, шкуры) — добываются с монстров.", "Чёрная Кровь (ихор) — извлекается из заражённых существ (1 единица с существа с ПО ≥ 1/4, проверка Медицины Сл 10 + ПО).", "Искры Веры — редкий ресурс, получаемый за сюжетные действия.", "Вы можете нести с собой до вашего мод. Интеллекта + уровень × 3 единиц Ингредиентов (суммарно). Это не занимает обычный инвентарь — это ваш специализированный запас.", "Экстракты (1-я Ступень): Во время короткого отдыха или действием (тратя 1 единицу Чёрной Крови на «ускоренный синтез») вы можете создать Экстракт из Ингредиентов. Экстракт — это одноразовый предмет. Максимум носимых с собой Экстрактов равен вашему мод. Интеллекта + бонус мастерства. Неиспользованные Экстракты портятся после длинного отдыха, если не закреплены алхимическим стабилизатором (автоматически с 5-й Ступени).", "Базовые Экстракты (доступны с 1-й Ступени):"]}, {"id": 24, "name": "Пепельный Тактик", "essence": "Ваш шёпот — закон. Вы произносите одно слово, и жертва подчиняется.", "params": {"Кубик хитов": "1d8", "Хиты на 1-й Ступени": "8 + мод. Телосложения", "Хиты на следующих": "1d8 (или 5) + мод. Телосложения", "Владение доспехами": "Средние", "Владение оружием": "Простое, воинское (дробящее и древковое)", "Владение инструментами": "Набор для лепки, набор алхимика", "Спасброски": "Интеллект, Телосложение", "Навыки": "Три из: Магия (Тайны), Анализ, История, Медицина, Религия, Убеждение"}, "mechanic_notes": ["Ключевая механика: Пепельные Конструкты и Пеплы Творения", "Пеплы Творения (1-я Ступень): Ваш личный ресурс, который вы создаёте вне боя, тратя Прах (общий ресурс группы) и проводя 10-минутный ритуал над останками. Трата 1 Праха даёт 1 Пепел Творения. Максимум Пеплов Творения, который вы можете носить с собой, равен вашему мод. Интеллекта + Бонус Мастерства. Они не портятся и не исчезают после отдыха.", "При старте через Пролог «Ночь Тепла и Пепла» персонаж получает 2 Пепла Творения как аванс от Лампы, позволяющий немедленно создать первого конструкта.", "Пепельные Конструкты (1-я Ступень): Вы можете действием потратить указанное количество Пеплов Творения и Материалы (кости, пепел, ихор), чтобы создать одного из следующих конструктов. Конструкты выглядят как жуткие тотемы, големы или сгустки пепла. Вы можете иметь до 2 конструктов одновременно (3 на 9-й Ступени, 4 на 17-й). Если конструкт уничтожен, Пеплы Творения не возвращаются. Вы можете разобрать конструкта действием, вернув половину потраченных Пеплов.", "Костяной Тотем (Страж): Стационарный тотем высотой 3 фута (КД 15, хиты = ваш уровень × 3). Излучает Ауру Покоя (15 фт): союзники в ауре получают +1 к спасброскам. Может действием выстрелить костяным осколком (дальность 60 фт, атака: + ваш БМ + Инт, урон 1к8 + Инт колющего урона). Стоимость: 2 Пепла Творения.", "Ихорная Завеса (Щит): Переносной генератор облака (КД 18, хиты = ваш уровень × 2). Союзник в 5 фт может реакцией активировать Завесу, чтобы получить +3 КД до начала следующего хода. Завеса даёт половину укрытия тем, кто находится непосредственно за ней. Стоимость: 2 Пепла Творения.", "Усиление Пеплом (2-я Ступень): Бонусным действием потратить 1 Пепел Творения, чтобы напитать оружие союзника (или своё) ихором и пеплом. На 1 минуту оно наносит дополнительный 1к6 урона ихорным уроном и считается магическим.", "Внеступенчатая находка: Модификации (как чертежи). См. Приложение 5."]}], let CHAR = JSON.parse(localStorage.getItem('fh_char_v2') || 'null');
function saveChar() { if (CHAR) localStorage.setItem('fh_char_v2', JSON.stringify(CHAR)); }
function mod(val) { return Math.floor(((parseInt(val)||10) - 10) / 2); }
function fmtMod(m) { return m >= 0 ? `+${m}` : `${m}`; }
function dodgeMax(dex) { return Math.max(1, 1 + Math.floor(((parseInt(dex)||10) - 10) / 4)); }

      <div class="grid-2">${BACKGROUNDS.map(b => `<div class="wizard-step ${wizDraft.bgName===b.name?'selected':''}" onclick="wizDraft.bgName='${b.name}'; renderWizard()">
        <span class="badge">${b.link}</span>

function finishWizard() {
  const lik = PUBLIC.liks.find(l => l.id === wizDraft.likId) || PUBLIC.liks;
  const deed = DEEDS_LIST.find(d => d.id === wizDraft.deedId) || DEEDS_LIST;

  const hdMatch = (lik.params['Кубик хитов'] || '1d8').match(/d(\d+)/);

  const raceHpBonus = (wizDraft.race === "Дитя Пепла" || wizDraft.race === "Спекшийся") ? 1 : 0;
  const maxHp = hdVal + mod(wizDraft.stats.con) + (deed.id === 'martyr' ? 2 : 0) + raceHpBonus;

    magicTradition: lik.name, spellSlots: [false, false, false, false, false], knownSpells: "", uniqueMagic: "", unlockedCodes: []
  };
  saveChar(); renderSheet();
}

    const unlockedList = CHAR.unlockedCodes.map(c => SECRET.recipes_dict[c]).filter(Boolean);
    return `<div class="grid-2"><div class="card"><h2>Книга Силы</h2>
      <label>Источник</label><input type="text" value="${CHAR.magicTradition}" onchange="CHAR.magicTradition=this.value; saveChar()" style="margin-bottom:10px;">
      <label>Ячейки Отголосков / Дыхания</label><div class="chk-group" style="margin-bottom:12px;">${CHAR.spellSlots.map((s, i) => `<input type="checkbox" class="chk-box" ${s?'checked':''} onchange="CHAR.spellSlots[${i}]=this.checked; saveChar()">`).join('')}</div>
      <label>Слова / Отголоски / Ритуалы</label><textarea style="min-height:120px;margin-bottom:12px;" onchange="CHAR.knownSpells=this.value; saveChar()">${CHAR.knownSpells}</textarea>
      <label>Принципы и заметки</label><textarea onchange="CHAR.uniqueMagic=this.value; saveChar()">${CHAR.uniqueMagic}</textarea></div>
      <div class="card"><h2>Рецепты и Тлеющие Угли</h2><p class="small">Введи код чертежа от Мастера:</p>
      <div style="display:flex;gap:8px;margin-bottom:16px;"><input type="text" id="recipe-code-inp" placeholder="FH-XXXXXX" style="text-transform:uppercase;"><button class="primary" onclick="unlockRecipe()">Открыть</button></div>
      ${unlockedList.map(r => `<div class="card" style="background:var(--card);padding:12px;"><span class="badge">${r.tag} • ${r.code}</span><h3>${r.title}</h3>${r.lines.map(ln => `<p class="small">${ln}</p>`).join('')}</div>`).join('')}</div></div>`;
  }
}

function unlockRecipe() {
  const code = document.getElementById('recipe-code-inp').value.trim().toUpperCase();
  if (!SECRET.recipes_dict[code]) { alert("Неверный код рецепта!"); return; }
  if (!CHAR.unlockedCodes.includes(code)) { CHAR.unlockedCodes.push(code); saveChar(); }
  renderSheet();
}

function exportChar() {
  if (!CHAR) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(CHAR, null, 2)], { type: "application/json" }));
  a.download = `${CHAR.name || 'character'}_fading_heart.json`; a.click();
}

function importChar(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => { try { CHAR = JSON.parse(ev.target.result); saveChar(); renderSheet(); } catch { alert("Ошибка файла."); } };
  r.readAsText(file);
}

function openGmModal() { if (GM_DATA) { renderGM(); return; } document.getElementById('gm-modal').classList.add('open'); }
function closeGmModal() { document.getElementById('gm-modal').classList.remove('open'); }
function b64ToBytes(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }

async function unlockGM() {
  const pass = document.getElementById('gm-pass-input').value;
  try {
    const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64ToBytes(SECRET.salt), iterations: 100000, hash: "SHA-256" }, keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const decBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(SECRET.iv) }, key, b64ToBytes(SECRET.ct));
    GM_DATA = JSON.parse(new TextDecoder().decode(decBuf));
    document.getElementById('gm-err').style.display = 'none'; closeGmModal();
    document.getElementById('gm-login-btn').innerText = "🔓 Ширма Мастера"; renderGM();
  } catch (e) { document.getElementById('gm-err').style.display = 'block'; }
}

let gmTab = 'codes';
function renderGM() {
  const view = document.getElementById('main-view');
  view.innerHTML = `<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h2 style="margin:0;border:none;">🔥 Закрытая Ширма Мастера</h2>
      <button onclick="renderSheet()">← Вернуться к Листу Игрока</button>
    </div>
    <div class="sheet-tabs">
      <button class="sheet-tab ${gmTab==='codes'?'active':''}" onclick="gmTab='codes'; renderGM()">Коды Рецептов и Углей</button>
      <button class="sheet-tab ${gmTab==='liks'?'active':''}" onclick="gmTab='liks'; renderGM()">24 Лика и Принципы</button>
      <button class="sheet-tab ${gmTab==='bestiary'?'active':''}" onclick="gmTab='bestiary'; renderGM()">Бестиарий</button>
      <button class="sheet-tab ${gmTab==='locations'?'active':''}" onclick="gmTab='locations'; renderGM()">Карточки Локаций</button>
    </div>
    <div id="gm-content"></div>
  </div>`;

  const box = document.getElementById('gm-content');
  if (gmTab === 'codes') {
    box.innerHTML = `<table><tr><th>Код</th><th>Категория</th><th>Название</th><th>Описание</th></tr>
      ${GM_DATA.unlockables.map(u => `<tr><td><b style="color:var(--gold)">${u.code}</b></td><td>${u.tag}</td><td><b>${u.title}</b></td><td>${u.lines.join('<br>')}</td></tr>`).join('')}
      </table>`;
  } else if (gmTab === 'liks') {
    box.innerHTML = GM_DATA.liks.map(l => `<details style="margin-bottom:10px;border:1px solid var(--border);padding:10px;border-radius:6px;">
      <summary style="cursor:pointer;color:var(--gold);font-weight:bold;">${l.id}. ${l.name}</summary>
      <table><tr><th>Ст.</th><th>Символ</th><th>Условие</th><th>Принцип</th><th>Резонанс / Диссонанс</th></tr>
      ${l.recipes.map((r, i) => {
        const pr = l.principles[i-1] || {};
        return `<tr><td>${r.step}</td><td>${r.symbol}</td><td>${r.condition}</td><td>${pr.principle||'—'}</td><td><div class="res">${pr.resonance||''}</div><div class="dis">${pr.dissonance||''}</div></td></tr>`;
      }).join('')}</table></details>`).join('');
  } else if (gmTab === 'bestiary') {
    box.innerHTML = `<div class="grid-2">` + GM_DATA.bestiary.map(b => `<div class="card" style="background:var(--card)">
      <span class="badge">${b.act}</span><h3>${b.name}</h3><p class="small">${b.description}</p>
      <table>${Object.entries(b.stats).map(([k,v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table></div>`).join('') + `</div>`;
  } else if (gmTab === 'locations') {
    box.innerHTML = `<div class="grid-2">` + GM_DATA.locations.map(loc => `<div class="card" style="background:var(--card)">
      <span class="badge">${loc.act} • ${loc.module}</span><h3>${loc.title}</h3>
      ${loc.lines.map(ln => `<p class="small">${ln}</p>`).join('')}</div>`).join('') + `</div>`;
  }
}

if (CHAR) renderSheet(); else showWizard();
</script></body></html>
